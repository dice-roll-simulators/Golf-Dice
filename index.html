<title>Fairway Draft Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

  :root{
    --bg: #f2f1e9; --bg-raised: #ffffff; --bg-sidebar:#ece9dd; --ink: #1b2a22; --ink-soft: #4a564d; --ink-faint: #7c8579;
    --line: rgba(27,42,34,0.12); --accent: #2f6e4f; --accent-soft: rgba(47,110,79,0.10); --accent-strong: #1f4c37;
    --flag: #b8442d; --flag-soft: rgba(184,68,45,0.10); --sand: #d9cba3; --sand-soft: rgba(217,203,163,0.28);
    --blue: #3b6eb4; --blue-soft: rgba(59,110,180,0.12); --good:#2f6e4f; --bad:#b8442d;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #10201a; --bg-raised: #16261f; --bg-sidebar:#0c1a15; --ink: #eef2ea; --ink-soft: #b9c4b7; --ink-faint: #82927f;
      --line: rgba(238,242,234,0.12); --accent: #6fbf95; --accent-soft: rgba(111,191,149,0.14); --accent-strong: #9adcb8;
      --flag: #e08469; --flag-soft: rgba(224,132,105,0.14); --sand: #a8935f; --sand-soft: rgba(168,147,95,0.16);
      --blue: #8fb6ea; --blue-soft: rgba(143,182,234,0.14); --good:#6fbf95; --bad:#e08469;
    }
  }
  :root[data-theme="dark"]{
    --bg: #10201a; --bg-raised: #16261f; --bg-sidebar:#0c1a15; --ink: #eef2ea; --ink-soft: #b9c4b7; --ink-faint: #82927f;
    --line: rgba(238,242,234,0.12); --accent: #6fbf95; --accent-soft: rgba(111,191,149,0.14); --accent-strong: #9adcb8;
    --flag: #e08469; --flag-soft: rgba(224,132,105,0.14); --sand: #a8935f; --sand-soft: rgba(168,147,95,0.16);
    --blue: #8fb6ea; --blue-soft: rgba(143,182,234,0.14); --good:#6fbf95; --bad:#e08469;
  }

  *{ box-sizing:border-box; }
  body{ background:var(--bg); color:var(--ink); font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif; line-height:1.45; -webkit-font-smoothing:antialiased; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; letter-spacing:-0.01em; margin:0; }

  .app{ display:flex; align-items:flex-start; }

  /* sidebar */
  .sidebar{ width:250px; flex:0 0 auto; background:var(--bg-sidebar); border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:22px; }
  .brand{ display:flex; flex-direction:column; gap:4px; padding:0 6px 14px; border-bottom:1px solid var(--line); }
  .brand .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--accent); font-weight:600; display:flex; align-items:center; gap:8px; }
  .brand .eyebrow::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--flag); }
  .brand h1{ font-size:1.3rem; font-weight:600; }
  .nav-group{ display:flex; flex-direction:column; gap:2px; }
  .nav-group-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint); padding:0 10px; margin-bottom:4px; }
  .nav-btn{ text-align:left; background:none; border:none; padding:7px 10px; border-radius:8px; font-size:0.86rem; color:var(--ink-soft); cursor:pointer; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .nav-btn:hover{ background:var(--accent-soft); color:var(--ink); }
  .nav-btn.active{ background:var(--accent); color:#fff; font-weight:600; }
  :root[data-theme="dark"] .nav-btn.active, :root:not([data-theme="light"]) .nav-btn.active{ color:#0c1a15; }
  .nav-btn .badge{ font-family:'IBM Plex Mono',monospace; font-size:10px; opacity:0.75; }

  /* main */
  .main{ flex:1; min-width:0; padding:36px 40px 80px; overflow-x:hidden; }
  .view{ display:none; flex-direction:column; gap:20px; max-width:1180px; }
  .view.active{ display:flex; }
  .view-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:18px; }
  .view-head h2{ font-size:1.7rem; font-weight:600; }
  .view-head .meta{ font-family:'IBM Plex Mono',monospace; font-size:0.8rem; color:var(--ink-faint); text-align:right; }
  .view-note{ color:var(--ink-soft); font-size:0.92rem; max-width:78ch; }

  select, input[type="number"], input[type="text"]{ font-family:'Work Sans',sans-serif; color:var(--ink); background:var(--bg-raised); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:0.88rem; }
  select:focus-visible, input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .picker-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .picker-row label{ font-family:'IBM Plex Mono',monospace; font-size:0.76rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-faint); }

  .data-section{ display:flex; flex-direction:column; gap:10px; padding:18px 0; border-bottom:1px solid var(--line); }
  .data-section:last-child{ border-bottom:none; }
  .data-section h3{ font-size:1.05rem; font-weight:600; }
  .data-textarea{ width:100%; min-height:160px; resize:vertical; font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--ink); background:var(--bg-raised); border:1px solid var(--line); border-radius:8px; padding:12px; box-sizing:border-box; }
  .data-textarea:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  /* custom dropdown (native <select> popups were freezing inside the artifact frame) */
  .ddown{ position:relative; min-width:300px; }
  .ddown-btn{ width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-family:'Work Sans',sans-serif; font-size:0.88rem; color:var(--ink); background:var(--bg-raised);
    border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer; }
  .ddown-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .ddown-btn .car{ color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; font-size:0.7rem; }
  .ddown-menu{ position:absolute; top:calc(100% + 4px); left:0; right:0; max-height:340px; overflow-y:auto;
    background:var(--bg-raised); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.18);
    z-index:20; display:none; padding:6px; }
  .ddown.open .ddown-menu{ display:block; }
  .ddown-group-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-faint); padding:6px 8px 2px; }
  .ddown-opt{ padding:7px 9px; border-radius:6px; font-size:0.86rem; cursor:pointer; }
  .ddown-opt:hover, .ddown-opt.hover{ background:var(--accent-soft); }
  .ddown-opt.selected{ color:var(--accent-strong); font-weight:600; }

  .table-wrap{ border:1px solid var(--line); border-radius:14px; overflow:auto; background:var(--bg-raised); max-height:560px; }
  table{ width:100%; border-collapse:collapse; font-size:0.87rem; }
  thead th{ position:sticky; top:0; background:var(--sand-soft); text-align:left; font-family:'IBM Plex Mono',monospace; font-size:0.7rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); padding:9px 12px; border-bottom:1px solid var(--line); z-index:1; }
  tbody td{ padding:6px 12px; border-bottom:1px solid var(--line); }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--accent-soft); }
  td.name{ font-weight:500; white-space:nowrap; }
  td.ctry{ font-family:'IBM Plex Mono',monospace; font-size:0.7rem; color:var(--ink-faint); text-transform:uppercase; }
  td.num{ text-align:center; }
  td.rk{ font-family:'IBM Plex Mono',monospace; color:var(--accent-strong); font-weight:600; width:36px; }
  .hole-input{ width:34px; text-align:center; padding:5px 2px; font-size:0.8rem; }
  .hole-input:disabled{ background:var(--sand-soft); color:var(--ink-faint); border-color:transparent; }
  th.hole-th{ text-align:center; padding-left:6px; padding-right:6px; }
  .lock-row{ display:flex; align-items:center; gap:12px; }
  .lock-status{ font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--accent-strong); display:flex; align-items:center; gap:6px; }
  .score-total{ font-weight:700; }
  .score-total.good{ color:var(--good); }
  .score-total.bad{ color:var(--bad); }
  .dash{ color:var(--ink-faint); }

  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ font-family:'IBM Plex Mono',monospace; font-size:0.7rem; letter-spacing:0.04em; padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--ink-soft); }

  /* dice */
  .dice-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; }
  .die-card{ border:1px solid var(--line); border-radius:16px; background:var(--bg-raised); padding:18px; display:flex; flex-direction:column; gap:12px; }
  .die-card h3{ font-size:1.05rem; }
  .die-faces{ display:flex; flex-wrap:wrap; gap:6px; }
  .face-chip{ font-family:'IBM Plex Mono',monospace; font-size:0.68rem; padding:3px 8px; border-radius:999px; background:var(--sand-soft); color:var(--ink-soft); }
  .die-roll-btn{ font-family:'IBM Plex Mono',monospace; font-size:0.82rem; letter-spacing:0.04em; text-transform:uppercase; padding:10px 14px; border-radius:10px; border:none; background:var(--accent); color:#fff; cursor:pointer; font-weight:600; }
  :root[data-theme="dark"] .die-roll-btn, :root:not([data-theme="light"]) .die-roll-btn{ color:#0c1a15; }
  .die-roll-btn:hover{ background:var(--accent-strong); }
  .die-result{ font-family:'Fraunces',Georgia,serif; font-size:1.5rem; font-weight:600; min-height:1.8em; }
  .die-result.eagle{ color:#c48a2a; }
  .die-result.birdie{ color:var(--good); }
  .die-result.par{ color:var(--ink); }
  .die-result.bogey{ color:var(--blue); }
  .die-result.doubleBogey, .die-result.tripleBogey{ color:var(--bad); }
  .die-log{ font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--ink-faint); display:flex; flex-wrap:wrap; gap:5px; }
  .die-log span{ padding:2px 6px; border-radius:6px; background:var(--sand-soft); }

  .btn{ font-family:'IBM Plex Mono',monospace; font-size:0.78rem; letter-spacing:0.03em; padding:9px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg-raised); color:var(--ink-soft); cursor:pointer; }
  .btn:hover{ background:var(--accent-soft); color:var(--ink); }
  .btn:disabled{ cursor:default; }
  .btn:disabled:hover{ background:var(--bg-raised); color:var(--ink-soft); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  :root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary{ color:#0c1a15; }
  .btn.danger{ border-color:var(--bad); color:var(--bad); }
  .btn.danger:hover{ background:rgba(184,68,45,0.12); color:var(--bad); }
  .btn.danger:disabled{ opacity:0.5; }
  .btn.danger:disabled:hover{ background:var(--bg-raised); }
  .lock-row{ flex-wrap:wrap; }

  .move{ font-size:0.78rem; font-weight:600; white-space:nowrap; }
  .move-up{ color:var(--good); }
  .move-down{ color:var(--bad); }
  .move-flat{ color:var(--ink-faint); font-weight:400; }
  .move-new{ color:var(--accent-strong); }

  .disclaimer{ font-size:0.83rem; color:var(--ink-faint); background:var(--sand-soft); border:1px solid var(--line); border-radius:10px; padding:11px 15px; max-width:78ch; }
  .disclaimer b{ color:var(--ink-soft); font-weight:600; }

  @media (max-width: 860px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; flex-wrap:nowrap; overflow-x:auto; border-right:none; border-bottom:1px solid var(--line); }
    .nav-group{ flex-direction:row; flex:0 0 auto; }
    .nav-group-label{ display:none; }
    .main{ padding:24px 16px 60px; }
  }
</style>

</div>

  function tournamentWrPoints(tKey, t, cut) {
    const owgrTable = t.group === 'champ' ? DATA.pointTables.owgrRegular : DATA.pointTables.owgrMajor;
    const rowsForPts = t.field.map(p => {
      if (cut && cut.missedCut.has(p.name)) return null;
      const rounds = [1, 2, 3, 4].map(n => roundValue(tKey, n, p.name)).filter(v => v !== null);
      return rounds.length ? { name: p.name, total: rounds.reduce((a, b) => a + b, 0) } : null;
    }).filter(Boolean);
    rowsForPts.sort((a, b) => a.total - b.total || compareBySurname(a.name, b.name));
    const pts = pointsWithTies(rowsForPts, owgrTable);
    const map = new Map();
    rowsForPts.forEach((r, i) => map.set(r.name, pts[i]));
    return map;
  }

  // ---------------- Challenger Series (auto-triggered shadow tour) ----------------
  // A Championship Series tournament is "complete" once every player has a
  // round 1+2 total (so the cut is final, not just projected) and everyone
  // who made that final cut has both round 3 and round 4 in.
  function isRoundLocked(tKey, n) {
    return !!(STATE.roundLocked[tKey] && STATE.roundLocked[tKey]['r' + n]);
  }
  // "Complete" means rounds 1 and 2 are locked (so the cut is final) and
  // rounds 3 and 4 are locked too (so everyone who made the cut has a real
  // finish) — locking, not just filling every box, is what closes a round out.
  function isTournamentComplete(tKey) {
    const t = byKey[tKey];
    const sc = STATE.scores[tKey];
    if (!t || !sc) return false;
    if (!isRoundLocked(tKey, 1) || !isRoundLocked(tKey, 2)) return false;
    if (!isRoundLocked(tKey, 3) || !isRoundLocked(tKey, 4)) return false;
    const cut = computeCut(tKey);
    if (!cut || cut.enteredCount < t.field.length) return false;
    for (const p of t.field) {
      if (cut.missedCut.has(p.name)) continue;
      if (roundValue(tKey, 3, p.name) === null || roundValue(tKey, 4, p.name) === null) return false;
    }
    return true;
  }

  // Data-completeness check for one round, independent of whether it has
  // actually been locked yet — this is what gates the tournament-level
  // "Lock scores" button (which locks every remaining round in one go).
  function isRoundDataComplete(tKey, n) {
    const t = byKey[tKey];
    if (!t) return false;
    if (n >= 3) {
      const cut = computeCut(tKey);
      if (!cut || cut.enteredCount < t.field.length) return false;
      return t.field.every(p => cut.missedCut.has(p.name) || roundValue(tKey, n, p.name) !== null);
    }
    return t.field.every(p => roundValue(tKey, n, p.name) !== null);
  }
  function canLockTournament(tKey) { return [1, 2, 3, 4].every(n => isRoundDataComplete(tKey, n)); }
  function isTournamentLocked(tKey) { return [1, 2, 3, 4].every(n => isRoundLocked(tKey, n)); }
  // Finalizes every round at once (rather than requiring a visit to each of
  // the four Round tabs) — locking saves immediately, so the tournament's
  // data is complete and persisted the moment it's locked.
  function lockTournamentResults(tKey) {
    if (!canLockTournament(tKey)) return;
    if (!STATE.roundLocked[tKey]) STATE.roundLocked[tKey] = {};
    [1, 2, 3, 4].forEach(n => { STATE.roundLocked[tKey]['r' + n] = true; });
    saveState();
    checkChallengerTriggers();
    checkCompletionLog();
  }
  // Wipes a tournament back to unplayed — scores, round locks, and its
  // Challenger Series companion event (if one has auto-run off it) — so a
  // seeded/trial result can be removed before the season actually starts.
  function clearTournamentResults(tKey) {
    delete STATE.scores[tKey];
    delete STATE.roundLocked[tKey];
    const clIdx = STATE.challengerLog.indexOf(tKey);
    if (clIdx !== -1) STATE.challengerLog.splice(clIdx, 1);
    STATE.challengerResults = STATE.challengerResults.filter(ev => ev.triggerKey !== tKey);
    const crIdx = STATE.challengerRefreshed.indexOf(tKey);
    if (crIdx !== -1) STATE.challengerRefreshed.splice(crIdx, 1);
    const compIdx = STATE.completionLog.indexOf(tKey);
    if (compIdx !== -1) STATE.completionLog.splice(compIdx, 1);
    saveState();
  }

  // Chronological log of every tournament (Championship Series, majors,
  // THE PLAYERS — not just the champ group Challenger triggers off) the
  // moment it's complete. This is what lets the Standings tabs reconstruct
  // "the rankings right before the last submitted tournament" without
  // storing a separate snapshot: the previous view is just the current
  // standings recomputed with that one tournament's contribution rolled back.
  function checkCompletionLog() {
    let changed = false;
    DATA.tournaments.forEach(t => {
      if (STATE.completionLog.includes(t.key)) return;
      if (!isTournamentComplete(t.key)) return;
      STATE.completionLog.push(t.key);
      changed = true;
    });
    if (changed) saveState();
    return changed;
  }

  // Randomised companion event drawn from the open depth pool, weighted
  // toward the top of the pool the same way the Depth Pool tab's resample
  // does. Challenger Series points use the full Championship Series
  // (Signature-tier) table; World Ranking points use the regular-event OWGR
  // table at HALF value — per tournament, worth the same as a Championship
  // Series event on the Challenger board, but only half the World Ranking
  // weight, and with zero effect on the real Championship Series standings.
  function runChallengerEvent(trigger) {
    const size = 120 + Math.floor(Math.random() * 21); // 120-140
    const field = weightedSample(DATA.backgroundPool, size, Math.random);
    const order = weightedSample(field, field.length, Math.random);
    const owgrTable = DATA.pointTables.owgrRegular;
    const champTable = DATA.pointTables.champSignature;
    const result = order.map((p, i) => {
      const rank = i + 1;
      return { name: p.name, country: p.country, rank, owgrPts: pointsForRank(owgrTable, rank) * 0.5, challengerPts: pointsForRank(champTable, rank) };
    });
    return { triggerKey: trigger.key, triggerName: trigger.name, dates: trigger.dates, fieldSize: field.length, result };
  }

  function checkChallengerTriggers() {
    let changed = false;
    DATA.tournaments.filter(t => t.group === 'champ').forEach(t => {
      if (STATE.challengerLog.includes(t.key)) return;
      if (!isTournamentComplete(t.key)) return;
      STATE.challengerResults.push(runChallengerEvent(t));
      STATE.challengerLog.push(t.key);
      changed = true;
    });
    if (changed) saveState();
    return changed;
  }

  // Re-rolls one already-run Challenger Series event against the current
  // depth pool — allowed exactly once per event (e.g. after the pool itself
  // gets refreshed/rebalanced), tracked in STATE.challengerRefreshed.
  function canRefreshChallengerEvent(triggerKey) {
    return !STATE.challengerRefreshed.includes(triggerKey);
  }
  function refreshChallengerEvent(triggerKey) {
    if (!canRefreshChallengerEvent(triggerKey)) return false;
    const idx = STATE.challengerResults.findIndex(ev => ev.triggerKey === triggerKey);
    if (idx === -1) return false;
    STATE.challengerResults[idx] = runChallengerEvent(byKey[triggerKey]);
    STATE.challengerRefreshed.push(triggerKey);
    saveState();
    return true;
  }

  // Real OWGR ranking is an AVERAGE — total points earned divided by a
  // divisor. DATA.startingOwgr holds averages (e.g. Scheffler 17.57), so we
  // convert that back into an implied starting total (average * 40), add raw
  // per-tournament points on top, then divide by the same fixed 40 for
  // display. Championship Series points are a separate, un-averaged total —
  // real FedEx Cup points aren't divided by anything.
  const OWGR_DIVISOR = 40;
  // `excludeKey`, when given, skips that one tournament's contribution (and
  // its Challenger Series companion, if any) entirely — this is how the
  // Standings tabs reconstruct "the rankings right before that submission"
  // without needing a stored snapshot.
  function computeStandings(excludeKey) {
    const owgrTotal = {};
    Object.entries(DATA.startingOwgr).forEach(([name, avg]) => { owgrTotal[name] = avg * OWGR_DIVISOR; });
    const champ = {};
    DATA.tournaments.forEach(t => {
      if (t.key === excludeKey) return;
      const sc = STATE.scores[t.key];
      if (!sc) return;
      const cut = computeCut(t.key);
      const rows = t.field.map(p => {
        if (cut && cut.missedCut.has(p.name)) return null; // 0 points, same as real golf
        const rounds = [1, 2, 3, 4].map(n => roundValue(t.key, n, p.name)).filter(v => v !== null);
        return rounds.length ? { p, total: rounds.reduce((a, b) => a + b, 0) } : null;
      }).filter(Boolean);
      rows.sort((a, b) => a.total - b.total || compareBySurname(a.p.name, b.p.name));
      const owgrTable = t.group === 'champ' ? DATA.pointTables.owgrRegular : DATA.pointTables.owgrMajor;
      const champTable = t.group === 'champ' ? DATA.pointTables.champSignature : DATA.pointTables.champMajor;
      const owgrPts = pointsWithTies(rows, owgrTable);
      const champPts = pointsWithTies(rows, champTable);
      rows.forEach((r, i) => {
        owgrTotal[r.p.name] = (owgrTotal[r.p.name] || 0) + owgrPts[i];
        champ[r.p.name] = (champ[r.p.name] || 0) + champPts[i];
      });
    });
    // Challenger Series: feeds World Ranking at half value, feeds its own
    // separate points board at full value, never touches `champ` above.
    const challenger = {};
    STATE.challengerResults.forEach(ev => {
      if (ev.triggerKey === excludeKey) return;
      ev.result.forEach(r => {
        owgrTotal[r.name] = (owgrTotal[r.name] || 0) + r.owgrPts;
        challenger[r.name] = (challenger[r.name] || 0) + r.challengerPts;
      });
    });
    const owgrAvg = {};
    Object.entries(owgrTotal).forEach(([name, total]) => { owgrAvg[name] = total / OWGR_DIVISOR; });
    return { owgr: owgrAvg, champ, challenger };
  }
  const GROUP_LABEL = { champ: 'Championship Series', players: 'THE PLAYERS', major: 'Major' };

  function fmtToPar(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return null;
    if (n === 0) return 'E';
    return n > 0 ? '+' + n : String(n);
  }

  // Alphabetical order is by surname (e.g. "Rory McIlroy" sorts under "M"),
  // stripping generational suffixes so "Notah Begay III" sorts under "Begay".
  const NAME_SUFFIXES = new Set(['jr', 'jr.', 'sr', 'sr.', 'ii', 'iii', 'iv', 'v']);
  function surname(fullName) {
    const parts = fullName.trim().split(/\s+/);
    while (parts.length > 1 && NAME_SUFFIXES.has(parts[parts.length - 1].toLowerCase().replace(/\.$/, ''))) {
      parts.pop();
    }
    return parts[parts.length - 1] || fullName;
  }
  function compareBySurname(a, b) { return surname(a).localeCompare(surname(b)); }

  // ---------------- nav ----------------
  const NAV = [];
  NAV.push({ group: 'Tools', items: [{ key: 'dice', label: 'Dice' }] });
  NAV.push({ group: 'Score Entry', items: [1, 2, 3, 4].map(n => ({ key: 'round' + n, label: 'Round ' + n })) });
  NAV.push({ group: 'Standings', items: [{ key: 'champpoints', label: 'Championship Series' }, { key: 'worldranking', label: 'World Ranking' }] });
  NAV.push({ group: 'Challenger Series', items: [{ key: 'challengertournament', label: 'Challenger Series Tournament' }, { key: 'challengerstandings', label: 'Challenger Series Standings' }] });
  NAV.push({ group: 'Championship Series', items: DATA.tournaments.filter(t => t.group === 'champ').map(t => ({ key: 'lb-' + t.key, label: t.name })) });
  NAV.push({ group: 'Majors & Players', items: DATA.tournaments.filter(t => t.group !== 'champ').map(t => ({ key: 'lb-' + t.key, label: t.name })) });
  NAV.push({ group: 'Reference', items: [{ key: 'reference', label: 'Depth Pool' }] });
  NAV.push({ group: 'Data', items: [{ key: 'data', label: 'Save / Load' }] });

  const sidebarEl = document.getElementById('sidebar');
  NAV.forEach(section => {
    const wrap = document.createElement('div');
    wrap.className = 'nav-group';
    const label = document.createElement('div');
    label.className = 'nav-group-label';
    label.textContent = section.group;
    wrap.appendChild(label);
    section.items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn';
      btn.dataset.view = item.key;
      btn.innerHTML = `<span>${item.label}</span>`;
      btn.addEventListener('click', () => selectView(item.key));
      wrap.appendChild(btn);
    });
    sidebarEl.appendChild(wrap);
  });

  let currentView = 'dice';
  function selectView(key) {
    currentView = key;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === key));
    try {
      renderCurrentView();
    } catch (err) {
      const el = viewContainer(key);
      el.innerHTML = `<div class="view-head"><h2>Something went wrong</h2></div><p class="view-note">${(err && err.stack || err).toString().replace(/</g, '&lt;')}</p>`;
      showOnly(key);
    }
  }

  const viewsEl = document.getElementById('views');
  function viewContainer(key) {
    let el = viewsEl.querySelector(`[data-view-panel="${key}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'view';
      el.dataset.viewPanel = key;
      viewsEl.appendChild(el);
    }
    return el;
  }
  function showOnly(key) {
    viewsEl.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.dataset.viewPanel === key));
  }

  function renderCurrentView() {
    if (currentView === 'dice') renderDice();
    else if (currentView.startsWith('round')) renderRound(parseInt(currentView.replace('round', ''), 10));
    else if (currentView.startsWith('lb-')) renderLeaderboard(currentView.slice(3));
    else if (currentView === 'champpoints') renderChampPoints();
    else if (currentView === 'worldranking') renderWorldRanking();
    else if (currentView === 'challengertournament') renderChallengerTournament();
    else if (currentView === 'challengerstandings') renderChallengerStandings();
    else if (currentView === 'reference') renderReference();
    else if (currentView === 'data') renderData();
    showOnly(currentView);
  }

  // ---------------- dice view ----------------
  function renderDice() {
    const el = viewContainer('dice');
    el.innerHTML = `<div class="view-head"><h2>Dice</h2><div class="meta">4 dice &middot; roll to resolve a shot</div></div>
      <p class="view-note">Roll a die to get an outcome, then key the resulting score into the matching player's round in the Score Entry tabs. Each die's face distribution is shown below its roll button.</p>
      <div class="dice-grid" id="dice-grid"></div>`;
    const grid = el.querySelector('#dice-grid');
    DICE.forEach(die => {
      const card = document.createElement('div');
      card.className = 'die-card';
      const facesHtml = Object.entries(die.faces).map(([f, c]) => `<span class="face-chip">${FACE_LABEL[f]} &times;${c}</span>`).join('');
      card.innerHTML = `<h3>${die.label}</h3>
        <div class="die-faces">${facesHtml}</div>
        <button class="die-roll-btn" data-die="${die.id}">Roll</button>
        <div class="die-result" id="result-${die.id}">—</div>
        <div class="die-log" id="log-${die.id}"></div>`;
      grid.appendChild(card);
      renderDieLog(die.id);
    });
    grid.querySelectorAll('.die-roll-btn').forEach(btn => {
      btn.addEventListener('click', () => rollDie(btn.dataset.die));
    });
  }
  function renderDieLog(dieId) {
    const el = document.getElementById('log-' + dieId);
    if (!el) return;
    el.innerHTML = STATE.diceLog[dieId].slice(-12).reverse().map(f => `<span>${FACE_LABEL[f]}</span>`).join('');
  }
  function rollDie(dieId) {
    const bag = DICE_BAGS[dieId];
    const face = bag[Math.floor(Math.random() * bag.length)];
    STATE.diceLog[dieId].push(face);
    if (STATE.diceLog[dieId].length > 200) STATE.diceLog[dieId].shift();
    saveState();
    const resultEl = document.getElementById('result-' + dieId);
    resultEl.textContent = FACE_LABEL[face];
    resultEl.className = 'die-result ' + face;
    renderDieLog(dieId);
  }

  // ---------------- custom dropdown ----------------
  // A plain <select><optgroup> repeatedly froze the artifact preview when
  // opened, so tournament pickers use this self-contained widget instead.
  let openDropdownCloser = null;
  function createDropdown(groups, currentValue, placeholder, onChange) {
    const wrap = document.createElement('div');
    wrap.className = 'ddown';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ddown-btn';
    const menu = document.createElement('div');
    menu.className = 'ddown-menu';

    let current = currentValue;
    function labelFor(value) {
      for (const g of groups) { const f = g.items.find(i => i.value === value); if (f) return f.label; }
      return placeholder;
    }
    function renderLabel() {
      btn.innerHTML = `<span>${labelFor(current)}</span><span class="car">▾</span>`;
    }
    function close() { wrap.classList.remove('open'); if (openDropdownCloser === close) openDropdownCloser = null; }
    function open() {
      if (openDropdownCloser) openDropdownCloser();
      wrap.classList.add('open');
      openDropdownCloser = close;
    }
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      wrap.classList.contains('open') ? close() : open();
    });
    menu.addEventListener('click', (e) => e.stopPropagation());

    groups.forEach(g => {
      if (g.label) {
        const gl = document.createElement('div');
        gl.className = 'ddown-group-label';
        gl.textContent = g.label;
        menu.appendChild(gl);
      }
      g.items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'ddown-opt' + (item.value === current ? ' selected' : '');
        row.textContent = item.label;
        row.addEventListener('click', () => {
          current = item.value;
          renderLabel();
          menu.querySelectorAll('.ddown-opt').forEach(r => r.classList.remove('selected'));
          row.classList.add('selected');
          close();
          onChange(current);
        });
        menu.appendChild(row);
      });
    });

    renderLabel();
    wrap.appendChild(btn);
    wrap.appendChild(menu);
    return wrap;
  }
  document.addEventListener('click', () => { if (openDropdownCloser) openDropdownCloser(); });

  // ---------------- round (score entry) view ----------------
  function renderRound(n) {
    const key = 'round' + n;
    const el = viewContainer(key);
    const selKey = 'r' + n;
    const selected = STATE.roundSelections[selKey];
    el.innerHTML = `<div class="view-head"><h2>Round ${n}</h2><div class="meta">score entry</div></div>
      <div class="picker-row">
        <label>Tournament</label>
        <div id="picker-${key}"></div>
      </div>
      <div id="round-body-${key}"></div>`;
    const groups = ['champ', 'players', 'major'].map(g => ({
      label: GROUP_LABEL[g],
      items: DATA.tournaments.filter(t => t.group === g).map(t => ({ value: t.key, label: t.name })),
    }));
    const pickerHost = el.querySelector('#picker-' + key);
    pickerHost.appendChild(createDropdown(groups, selected || '', '— choose a tournament —', (value) => {
      STATE.roundSelections[selKey] = value || null;
      saveState();
      renderRoundBody(key, n, value || null);
    }));
    renderRoundBody(key, n, selected);
  }

  // Assigns "1", "2", "T3", "T3", "5"... to a list already sorted ascending
  // by .total (no nulls) — real leaderboard tie handling: tied players share
  // a label and the next real position skips ahead by the group size.
  function assignPositions(sortedRows) {
    return assignPositionsField(sortedRows, r => r.total);
  }

  // A clickable "Pos." column header that toggles between field order and
  // score-sorted-with-ties — the sort control lives on the leaderboard itself.
  function sortableHeaderTh(getMode, setMode, rerender, fieldLabel) {
    const th = document.createElement('th');
    th.style.cursor = 'pointer';
    th.style.userSelect = 'none';
    function refresh() { th.innerHTML = getMode() === 'score' ? 'Pos. &#9662;' : (fieldLabel || '#') + ' &#9656;'; }
    th.addEventListener('click', () => { setMode(getMode() === 'score' ? 'field' : 'score'); refresh(); rerender(); });
    refresh();
    return th;
  }

  // A plain, non-interactive <th> — a small helper so header rows can be
  // built entirely via appendChild (mixing this with a later `innerHTML +=`
  // on the same row would silently strip event listeners off any header
  // already appended, e.g. the sortable ones below).
  function th(html) {
    const el = document.createElement('th');
    el.innerHTML = html;
    return el;
  }
  // A per-round header (R1…R4) that sorts the table by that round's score —
  // low to high, players without a value for that round sinking to the
  // bottom, ties broken by surname.
  function roundHeaderTh(label, mode, getMode, setMode, rerender) {
    const el = document.createElement('th');
    el.style.cursor = 'pointer';
    el.style.userSelect = 'none';
    function refresh() { el.innerHTML = getMode() === mode ? label + ' &#9662;' : label; }
    el.addEventListener('click', () => { setMode(mode); refresh(); rerender(); });
    refresh();
    return el;
  }

  // Generalized version of assignPositions below — assigns "1"/"T2"/"T2"/"4"
  // off any numeric getter, not just `.total`, so a round-column sort can
  // show tie-aware positions the same way the score sort does.
  function assignPositionsField(sortedRows, getVal) {
    let i = 0;
    while (i < sortedRows.length) {
      let j = i;
      while (j + 1 < sortedRows.length && getVal(sortedRows[j + 1]) === getVal(sortedRows[i])) j++;
      const pos = i + 1;
      const label = j > i ? 'T' + pos : String(pos);
      for (let k = i; k <= j; k++) sortedRows[k].posLabel = label;
      i = j + 1;
    }
    return sortedRows;
  }

  // ---------------- movement arrows (shared by leaderboards + standings) ----------------
  // Ranks a set of [name, value] pairs into 1-based tie-group-start positions
  // (same convention as assignPositionsField's posLabel numbers) — ascending
  // for golf scores (lower is better), descending for points (higher is
  // better). Returns name -> rank.
  function buildRankMap(pairs, ascending) {
    const sortedVals = pairs.map(([, v]) => v).sort((a, b) => ascending ? a - b : b - a);
    const map = new Map();
    pairs.forEach(([name, v]) => { if (!map.has(name)) map.set(name, sortedVals.indexOf(v) + 1); });
    return map;
  }
  // movement: positive = moved up that many places, negative = moved down,
  // 0 = held position, 'new' = wasn't ranked at the previous checkpoint,
  // null/undefined = no previous checkpoint to compare against.
  function movementHtml(movement) {
    if (movement === 'new') return '<span class="move move-new">NEW</span>';
    if (movement === null || movement === undefined) return '<span class="dash">–</span>';
    if (movement > 0) return `<span class="move move-up">&#9650;${movement}</span>`;
    if (movement < 0) return `<span class="move move-down">&#9660;${Math.abs(movement)}</span>`;
    return '<span class="move move-flat">&#9644;</span>';
  }
  // Attaches `.movement` to a standings-table `rows` array (each with
  // `.name`/`.points`, already the exact set shown) by comparing each
  // player's rank now against their rank in `prevMap` — a name -> points map
  // from a previous checkpoint (or null if there isn't one yet). `filterFn`,
  // if given, is applied to prevMap's entries so the previous ranking pool
  // matches whatever filtering the current rows already went through (e.g.
  // "points > 0").
  function attachMovement(rows, prevMap, filterFn) {
    if (!prevMap) { rows.forEach(r => { r.movement = null; }); return; }
    const currRankMap = buildRankMap(rows.map(r => [r.name, r.points]), false);
    const prevEntries = Object.entries(prevMap).filter(filterFn || (() => true));
    const prevRankMap = buildRankMap(prevEntries, false);
    rows.forEach(r => {
      const currRank = currRankMap.get(r.name);
      const prevRank = prevRankMap.get(r.name);
      r.movement = currRank === undefined ? null : (prevRank === undefined ? 'new' : prevRank - currRank);
    });
  }

  function parseHoleValue(raw) {
    raw = raw.trim();
    if (raw === '') return null;
    if (/^e$/i.test(raw)) return 0;
    if (/^[+-]?\d+$/.test(raw)) return parseInt(raw, 10);
    return undefined; // invalid — caller should reject
  }

  function renderRoundBody(domKey, n, tKey) {
    const body = document.getElementById('round-body-' + domKey);
    if (!tKey) { body.innerHTML = '<p class="view-note">Pick a tournament above to load its field.</p>'; return; }
    const t = byKey[tKey];
    if (!STATE.scores[tKey]) STATE.scores[tKey] = {};
    for (let i = 1; i <= n; i++) if (!STATE.scores[tKey]['r' + i]) STATE.scores[tKey]['r' + i] = {};
    const roundScores = STATE.scores[tKey]['r' + n];
    // Computed for every round (not just 3-4) so a player who's since missed
    // the cut still shows greyed out on Round 1/2 — they played those rounds
    // for real, so their entered scores stay visible, just dimmed.
    const cut = computeCut(tKey);
    // Each tournament has its own randomised draw order (t.startOrder, built
    // server-side) rather than every event listing the same roster order.
    const startOrderIndex = new Map((t.startOrder || t.field.map(p => p.name)).map((name, i) => [name, i]));

    // Round 1 starts in field order; rounds 2-4 default to the previous
    // round's leaderboard (thru-total sort), same as a real tee-time draw.
    let sortMode = n === 1 ? 'field' : 'score';
    body.innerHTML = '';
    const chips = document.createElement('div');
    chips.className = 'chips';
    chips.innerHTML = `<span class="chip">${t.field.length} players</span><span class="chip">${t.dates}</span><span class="chip">cut: top ${t.cutSize || 65} &amp; ties</span>`;
    body.appendChild(chips);
    if (cut) body.appendChild(Object.assign(document.createElement('p'), { className: 'view-note', textContent: `Cut projected at ${fmtToPar(cut.cutValue) || 'E'} (${cut.enteredCount} of ${t.field.length} entered so far) — ${cut.missedCut.size} player(s) sitting outside the line.` }));

    const lockRow = document.createElement('div');
    lockRow.className = 'lock-row';
    body.appendChild(lockRow);

    const tableHost = document.createElement('div');
    body.appendChild(tableHost);

    function holesFor(name) {
      let arr = roundScores[name];
      if (!Array.isArray(arr) || arr.length !== 18) {
        arr = new Array(18).fill(null);
        roundScores[name] = arr;
      }
      return arr;
    }
    // Everyone plays rounds 1-2; only rounds 3-4 are restricted to players
    // who made the cut.
    function needsThisRound(p) { return n < 3 || !(cut && cut.missedCut.has(p.name)); }
    function roundComplete() {
      return t.field.every(p => !needsThisRound(p) || holesFor(p.name).every(h => h !== null));
    }
    function thruTotal(name) {
      let sum = 0, any = false;
      for (let i = 1; i <= n; i++) {
        const v = roundValue(tKey, i, name);
        if (v !== null) { sum += v; any = true; }
      }
      return any ? sum : null;
    }

    function draw() {
      const locked = isRoundLocked(tKey, n);
      lockRow.innerHTML = '';
      if (locked) {
        lockRow.innerHTML = '<span class="lock-status">&#10003; Round locked in</span>';
      } else {
        const btn = document.createElement('button');
        btn.className = 'btn primary';
        btn.textContent = 'Enter — lock in Round ' + n;
        btn.disabled = !roundComplete();
        btn.addEventListener('click', () => {
          if (!roundComplete()) return;
          if (!STATE.roundLocked[tKey]) STATE.roundLocked[tKey] = {};
          STATE.roundLocked[tKey]['r' + n] = true;
          saveState();
          checkChallengerTriggers();
          checkCompletionLog();
          draw();
          if (currentView === 'lb-' + tKey) renderLeaderboard(tKey);
        });
        lockRow.appendChild(btn);
        if (!btn.disabled) lockRow.insertAdjacentHTML('beforeend', '<span class="view-note" style="margin:0;">Every hole for every player in the round is filled in — ready to lock.</span>');
        else lockRow.insertAdjacentHTML('beforeend', '<span class="view-note" style="margin:0;">Fill in all 18 holes for everyone playing this round to enable this.</span>');
      }

      let rows = t.field.map((p) => ({ p, fieldPos: (startOrderIndex.get(p.name) || 0) + 1, total: thruTotal(p.name), posLabel: null }));
      if (sortMode === 'field') {
        rows.sort((a, b) => a.fieldPos - b.fieldPos);
      } else if (sortMode === 'score') {
        rows.sort((a, b) => {
          if (a.total === null && b.total === null) return compareBySurname(a.p.name, b.p.name);
          if (a.total === null) return 1;
          if (b.total === null) return -1;
          return a.total - b.total;
        });
        assignPositions(rows.filter(r => r.total !== null));
      }
      tableHost.innerHTML = '';
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      headRow.appendChild(sortableHeaderTh(() => sortMode, (m) => { sortMode = m; }, draw, '#'));
      headRow.appendChild(th('Player'));
      headRow.appendChild(th('Ctry'));
      headRow.appendChild(th('Thru ' + (n - 1)));
      for (let h = 1; h <= 18; h++) { const c = th(String(h)); c.className = 'hole-th'; headRow.appendChild(c); }
      headRow.appendChild(th('Rd ' + n));
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      table.appendChild(tbody);
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      wrap.appendChild(table);
      tableHost.appendChild(wrap);
      rows.forEach(({ p, fieldPos, posLabel }) => {
        const missed = !!(cut && cut.missedCut.has(p.name));
        // Rounds 3-4 aren't played at all once a player's missed the cut;
        // rounds 1-2 were genuinely played, so still show their real scores,
        // just greyed out to signal they didn't advance.
        const skipRound = n >= 3 && missed;
        const posCell = sortMode === 'score' ? (posLabel || '<span class="dash">–</span>') : fieldPos;
        const priorSum = (() => {
          let s = 0, any = false;
          for (let i = 1; i < n; i++) { const v = roundValue(tKey, i, p.name); if (v !== null) { s += v; any = true; } }
          return any ? fmtToPar(s) : '<span class="dash">–</span>';
        })();
        const tr = document.createElement('tr');
        if (skipRound) {
          tr.style.opacity = '0.5';
          let mcCells = ''; for (let h = 0; h < 18; h++) mcCells += '<td class="num mono">–</td>';
          tr.innerHTML = `<td class="rk mono">${posCell}</td><td class="name">${p.name}</td><td class="ctry">${p.country}</td><td class="num mono">${priorSum}</td>${mcCells}<td class="num mono">MC</td>`;
        } else {
          if (missed) tr.style.opacity = '0.5';
          const holes = holesFor(p.name);
          let holeCells = '';
          for (let h = 0; h < 18; h++) {
            const v = holes[h];
            holeCells += `<td><input type="text" inputmode="numeric" class="hole-input mono" data-player="${p.name}" data-hole="${h}" value="${v !== null ? v : ''}" placeholder="E" ${locked ? 'disabled' : ''} /></td>`;
          }
          const roundTotal = holes.every(h => h !== null) ? fmtToPar(holes.reduce((a, b) => a + b, 0)) : '<span class="dash">–</span>';
          tr.innerHTML = `<td class="rk mono">${posCell}</td><td class="name">${p.name}</td><td class="ctry">${p.country}</td><td class="num mono">${priorSum}</td>${holeCells}<td class="num mono score-total">${roundTotal}</td>`;
        }
        tbody.appendChild(tr);
      });
      tbody.querySelectorAll('.hole-input').forEach(input => {
        input.addEventListener('change', () => {
          const v = parseHoleValue(input.value);
          if (v === undefined) { input.value = ''; return; }
          const holes = holesFor(input.dataset.player);
          holes[input.dataset.hole] = v;
          saveState();
          // Live-update just this row's total + the lock button, without a full re-render (keeps focus/scroll steady).
          const tr = input.closest('tr');
          const totalCell = tr.querySelector('td:last-child');
          const complete = holes.every(h => h !== null);
          totalCell.innerHTML = complete ? fmtToPar(holes.reduce((a, b) => a + b, 0)) : '<span class="dash">–</span>';
          const lockBtn = lockRow.querySelector('button');
          if (lockBtn) lockBtn.disabled = !roundComplete();
          if (currentView === 'lb-' + tKey) renderLeaderboard(tKey);
        });
      });
    }
    draw();
  }

  // ---------------- leaderboard view ----------------
  function renderLeaderboard(tKey) {
    const el = viewContainer('lb-' + tKey);
    const t = byKey[tKey];
    const cut = computeCut(tKey);
    // Each tournament has its own randomised draw order (t.startOrder, built
    // server-side) rather than every event listing the same roster order.
    const startOrderIndex = new Map((t.startOrder || t.field.map(p => p.name)).map((name, i) => [name, i]));
    const rows = t.field.map(p => {
      const rounds = [1, 2, 3, 4].map(n => roundValue(tKey, n, p.name));
      const played = rounds.filter(v => v !== null);
      const total = played.length ? played.reduce((a, b) => a + b, 0) : null;
      const missed = !!(cut && cut.missedCut.has(p.name));
      const fieldPos = (startOrderIndex.get(p.name) || 0) + 1;
      return { p, rounds, thru: played.length, total, missed, fieldPos };
    });

    // World Ranking points won in THIS tournament — the same live,
    // tie-shared calculation World Ranking itself uses per event, surfaced
    // here per player (mirrors the "World Ranking pts" column already shown
    // on the Challenger Series Tournament tab).
    const wrPtsMap = tournamentWrPoints(tKey, t, cut);
    rows.forEach(r => { r.wrPts = r.missed ? 0 : (wrPtsMap.get(r.p.name) ?? null); });

    // Movement arrows compare standings as of the latest LOCKED round to
    // standings as of the round before that — a real "before/after this
    // round was submitted" checkpoint, independent of whatever live/unlocked
    // data is still being entered for a later round.
    const lockedRounds = [1, 2, 3, 4].filter(n => isRoundLocked(tKey, n));
    const latestLocked = lockedRounds.length ? Math.max(...lockedRounds) : 0;
    const currRoundMap = latestLocked >= 1 ? standingsMap(tKey, latestLocked, cut, t.field) : null;
    const prevRoundMap = latestLocked >= 2 ? standingsMap(tKey, latestLocked - 1, cut, t.field) : null;
    rows.forEach(r => {
      if (r.missed || !currRoundMap || !prevRoundMap) { r.movement = null; return; }
      const currRank = currRoundMap.get(r.p.name);
      const prevRank = prevRoundMap.get(r.p.name);
      r.movement = (currRank !== undefined && prevRank !== undefined) ? prevRank - currRank : null;
    });

    let sortMode = 'score';
    el.innerHTML = `<div class="view-head"><h2>${t.name}</h2><div class="meta">${t.dates}<br/>field of ${t.field.length} &middot; cut: top ${t.cutSize || 65} &amp; ties</div></div>`;
    const controlRow = document.createElement('div');
    controlRow.className = 'lock-row';
    controlRow.style.marginBottom = '10px';
    el.appendChild(controlRow);
    el.insertAdjacentHTML('beforeend', `<p class="view-note">Live from whatever's been entered in Round 1&ndash;4 for this tournament — refreshes automatically as scores come in. Click "Pos." to sort by score, or a round header (R1&ndash;R4) to sort by that round, with ties shown as "T". Players outside the cut line score 0 toward the Championship Series and World Ranking. The Move column shows how a player's position changed once the most recently locked round was submitted, versus the round before it. WR pts is how many World Ranking points that finish is worth right now, tie-shared the same way the World Ranking tab totals them.</p>`);
    const tableHost = document.createElement('div');
    el.appendChild(tableHost);

    function drawControls() {
      controlRow.innerHTML = '';
      if (isTournamentLocked(tKey)) {
        controlRow.insertAdjacentHTML('beforeend', '<span class="lock-status">&#10003; Tournament locked — results final</span>');
      } else {
        const canLock = canLockTournament(tKey);
        const lockBtn = document.createElement('button');
        lockBtn.className = 'btn primary';
        lockBtn.textContent = 'Lock scores';
        lockBtn.disabled = !canLock;
        lockBtn.addEventListener('click', () => {
          lockTournamentResults(tKey);
          renderLeaderboard(tKey);
        });
        controlRow.appendChild(lockBtn);
        controlRow.insertAdjacentHTML('beforeend', `<span class="view-note" style="margin:0;">${canLock ? 'Every round is fully entered — locking finalizes this tournament’s results.' : 'Enter and complete Rounds 1–4 (via the Score Entry tabs) before locking.'}</span>`);
      }
      const clearBtn = document.createElement('button');
      clearBtn.className = 'btn danger';
      clearBtn.textContent = 'Clear results';
      clearBtn.disabled = !STATE.scores[tKey];
      clearBtn.addEventListener('click', () => {
        if (!confirm(`Clear all entered scores for ${t.name}? This removes every round entered so far (and its Challenger Series companion event, if one has run) and cannot be undone.`)) return;
        clearTournamentResults(tKey);
        renderLeaderboard(tKey);
      });
      controlRow.appendChild(clearBtn);
    }

    function draw() {
      drawControls();
      const sorted = rows.slice();
      const roundMatch = /^r([1-4])$/.exec(sortMode);
      if (sortMode === 'score') {
        sorted.sort((a, b) => {
          if (a.missed !== b.missed) return a.missed ? 1 : -1; // cut players sink below the line
          if (a.total === null && b.total === null) return compareBySurname(a.p.name, b.p.name);
          if (a.total === null) return 1;
          if (b.total === null) return -1;
          return a.total - b.total;
        });
        assignPositions(sorted.filter(r => !r.missed && r.total !== null));
      } else if (roundMatch) {
        const idx = parseInt(roundMatch[1], 10) - 1;
        sorted.sort((a, b) => {
          const av = a.rounds[idx], bv = b.rounds[idx];
          if (av === null && bv === null) return compareBySurname(a.p.name, b.p.name);
          if (av === null) return 1;
          if (bv === null) return -1;
          return av - bv;
        });
        assignPositionsField(sorted.filter(r => r.rounds[idx] !== null), r => r.rounds[idx]);
      } else if (sortMode === 'field') {
        sorted.sort((a, b) => a.fieldPos - b.fieldPos);
      }
      tableHost.innerHTML = '';
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      headRow.appendChild(sortableHeaderTh(() => sortMode, (m) => { sortMode = m; }, draw, '#'));
      headRow.appendChild(th('Move'));
      headRow.appendChild(th('Player'));
      headRow.appendChild(th('Ctry'));
      ['r1', 'r2', 'r3', 'r4'].forEach((rk, i) => {
        headRow.appendChild(roundHeaderTh('R' + (i + 1), rk, () => sortMode, (m) => { sortMode = m; }, draw));
      });
      headRow.appendChild(th('Thru'));
      headRow.appendChild(th('Total'));
      headRow.appendChild(th('WR pts'));
      thead.appendChild(headRow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      table.appendChild(tbody);
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      wrap.appendChild(table);
      tableHost.appendChild(wrap);
      const useLabel = sortMode === 'score' || !!roundMatch;
      sorted.forEach((r, idx) => {
        const cell = (v) => v === null ? '<span class="dash">–</span>' : fmtToPar(v);
        const tr = document.createElement('tr');
        const wrCell = r.wrPts === null ? '<span class="dash">–</span>' : r.wrPts.toFixed(4);
        if (r.missed) {
          tr.style.opacity = '0.55';
          tr.innerHTML = `<td class="rk mono">MC</td><td class="num mono">${movementHtml(null)}</td><td class="name">${r.p.name}</td><td class="ctry">${r.p.country}</td>
            <td class="num mono">${cell(r.rounds[0])}</td><td class="num mono">${cell(r.rounds[1])}</td><td class="num mono">–</td><td class="num mono">–</td>
            <td class="num mono">2/4</td><td class="num mono">${r.total === null ? '<span class="dash">–</span>' : fmtToPar(r.total)}</td><td class="num mono">${wrCell}</td>`;
        } else {
          const posCell = useLabel ? (r.posLabel || '<span class="dash">–</span>') : idx + 1;
          const totalCls = r.total === null ? '' : r.total < 0 ? 'good' : r.total > 0 ? 'bad' : '';
          tr.innerHTML = `<td class="rk mono">${posCell}</td><td class="num mono">${movementHtml(r.movement)}</td><td class="name">${r.p.name}</td><td class="ctry">${r.p.country}</td>
            <td class="num mono">${cell(r.rounds[0])}</td><td class="num mono">${cell(r.rounds[1])}</td><td class="num mono">${cell(r.rounds[2])}</td><td class="num mono">${cell(r.rounds[3])}</td>
            <td class="num mono">${r.thru}/4</td><td class="num mono score-total ${totalCls}">${r.total === null ? '<span class="dash">–</span>' : fmtToPar(r.total)}</td><td class="num mono">${wrCell}</td>`;
        }
        tbody.appendChild(tr);
      });
    }
    draw();
  }

  // ---------------- standings (Championship Series points + World Ranking) ----------------
  function addFilter(container, tbody, total) {
    const row = document.createElement('div');
    row.className = 'picker-row';
    row.style.marginBottom = '10px';
    row.innerHTML = `<input type="text" placeholder="Filter by name…" style="flex:1;max-width:280px;" /><span class="mono" style="color:var(--ink-faint);font-size:0.78rem;">${total} players</span>`;
    container.appendChild(row);
    const input = row.querySelector('input');
    const countEl = row.querySelector('span');
    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      let shown = 0;
      tbody.querySelectorAll('tr').forEach(tr => {
        const match = !q || tr.dataset.name.includes(q);
        tr.style.display = match ? '' : 'none';
        if (match) shown++;
      });
      countEl.textContent = q ? `${shown} / ${total} players` : `${total} players`;
    });
  }
  function standingsTable(el, rows) {
    const wrap = document.createElement('div');
    wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Pos</th><th>Move</th><th>Player</th><th>Ctry</th><th>Points</th></tr></thead><tbody></tbody></table></div>`;
    const tbody = wrap.querySelector('tbody');
    rows.forEach((r, i) => {
      const tr = document.createElement('tr');
      tr.dataset.name = r.name.toLowerCase();
      tr.innerHTML = `<td class="rk mono">${i + 1}</td><td class="num mono">${movementHtml(r.movement)}</td><td class="name">${r.name}</td><td class="ctry">${r.country || ''}</td><td class="num mono">${r.points.toFixed(2)}</td>`;
      tbody.appendChild(tr);
    });
    const filterRow = document.createElement('div');
    el.appendChild(filterRow);
    el.appendChild(wrap);
    addFilter(filterRow, tbody, rows.length);
  }
  // Both boards' movement arrows compare "now" to "right before the most
  // recently submitted tournament" — reconstructed by rolling that one
  // tournament (and its Challenger Series companion) back out of the same
  // live computation, rather than storing a separate history of snapshots.
  function lastCompletedTournamentKey() {
    return STATE.completionLog.length ? STATE.completionLog[STATE.completionLog.length - 1] : null;
  }
  function renderChampPoints() {
    const el = viewContainer('champpoints');
    const { champ } = computeStandings();
    const rows = Object.entries(champ)
      .filter(([, pts]) => pts > 0)
      .map(([name, pts]) => ({ name, country: NAME_INDEX.get(name), points: pts }))
      .sort((a, b) => b.points - a.points);
    const lastKey = lastCompletedTournamentKey();
    attachMovement(rows, lastKey ? computeStandings(lastKey).champ : null, ([, pts]) => pts > 0);
    el.innerHTML = `<div class="view-head"><h2>Championship Series Points</h2><div class="meta">${rows.length} players on the board</div></div>
      <p class="view-note">Season points from every Championship Series event, THE PLAYERS, and all four majors — recalculated live from whatever's entered in Round 1&ndash;4. Point values follow the <a href="https://en.wikipedia.org/wiki/List_of_point_distributions_of_the_FedEx_Cup" style="color:inherit;">FedEx Cup distribution</a> by tier (Signature-tier for the ${DATA.tournaments.filter(t => t.group === 'champ').length} Championship Series events, Major-tier for majors and THE PLAYERS). Entirely separate from the Challenger Series board — Challenger results never move this one. The Move column shows the shift caused by the last tournament submitted${lastKey ? ` (${byKey[lastKey].name})` : ''}.</p>`;
    if (!rows.length) { el.innerHTML += '<p class="view-note">No results yet — enter scores in Round 1&ndash;4 to populate this board.</p>'; return; }
    standingsTable(el, rows);
  }
  function renderWorldRanking() {
    const el = viewContainer('worldranking');
    const { owgr } = computeStandings();
    const rows = Object.entries(owgr)
      .map(([name, pts]) => ({ name, country: NAME_INDEX.get(name), points: pts }))
      .sort((a, b) => b.points - a.points);
    const lastKey = lastCompletedTournamentKey();
    attachMovement(rows, lastKey ? computeStandings(lastKey).owgr : null);
    el.innerHTML = `<div class="view-head"><h2>World Ranking</h2><div class="meta">${rows.length} ranked players</div></div>
      <p class="view-note">Average points — total points divided by ${OWGR_DIVISOR} — starting from the real OWGR snapshot (<a href="https://www.owgr.com/current-world-ranking" style="color:inherit;">owgr.com, Aug 2026</a>) and moving with every tournament entered in Round 1&ndash;4, including Challenger Series results at half value. Raw points per finish follow the real OWGR curve for a <a href="https://www.owgr.com/events/the-154th-open-11468" style="color:inherit;">major</a> or a <a href="https://www.owgr.com/events/cadillac-championship-11319" style="color:inherit;">regular event</a>, by tier, before being folded into the ${OWGR_DIVISOR}-divisor average. This is live, not a fixed snapshot. The Move column shows the shift caused by the last tournament submitted${lastKey ? ` (${byKey[lastKey].name})` : ''}.</p>`;
    standingsTable(el, rows);
  }

  // ---------------- Challenger Series ----------------
  function renderChallengerTournament() {
    const el = viewContainer('challengertournament');
    const results = STATE.challengerResults;
    el.innerHTML = `<div class="view-head"><h2>Challenger Series Tournament</h2><div class="meta">${results.length} event${results.length === 1 ? '' : 's'} run</div></div>
      <p class="view-note">Every time a Championship Series event finishes (round 1 cut through round 4), a companion Challenger Series event auto-runs here — a randomised, weighted result drawn from the real 121+ depth pool, ranks 121&ndash;${120 + DATA.backgroundPool.length}. Field size varies 120&ndash;140 each time. It has no effect on the Championship Series board; it feeds the Challenger Series Standings tab at full value and the World Ranking at half value. Each event can be re-rolled against the current depth pool exactly once, with "Refresh (once)" below it.</p>`;
    if (!results.length) {
      el.innerHTML += '<p class="view-note">Nothing yet — complete a Championship Series event (all rounds, cut included) in Round 1&ndash;4 to trigger the first one.</p>';
      return;
    }
    results.slice().reverse().forEach(ev => {
      const box = document.createElement('div');
      box.style.marginBottom = '28px';
      const canRefresh = canRefreshChallengerEvent(ev.triggerKey);
      const chips = document.createElement('div');
      chips.className = 'chips';
      chips.style.marginBottom = '10px';
      chips.innerHTML = `<span class="chip">Triggered by ${ev.triggerName}</span><span class="chip">${ev.dates}</span><span class="chip">${ev.fieldSize} players</span>`;
      const refreshBtn = document.createElement('button');
      refreshBtn.className = 'btn';
      refreshBtn.textContent = canRefresh ? 'Refresh (once)' : 'Already refreshed';
      refreshBtn.disabled = !canRefresh;
      if (!canRefresh) refreshBtn.style.opacity = '0.5';
      refreshBtn.addEventListener('click', () => {
        if (!refreshChallengerEvent(ev.triggerKey)) return;
        renderChallengerTournament();
      });
      chips.appendChild(refreshBtn);
      box.appendChild(chips);
      const wrap = document.createElement('div');
      wrap.innerHTML = `<div class="table-wrap" style="max-height:360px;"><table><thead><tr><th>Pos</th><th>Player</th><th>Ctry</th><th>Challenger pts</th><th>World Ranking pts</th></tr></thead><tbody></tbody></table></div>`;
      const tbody = wrap.querySelector('tbody');
      ev.result.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="rk mono">${r.rank}</td><td class="name">${r.name}</td><td class="ctry">${r.country}</td><td class="num mono">${r.challengerPts.toFixed(2)}</td><td class="num mono">${r.owgrPts.toFixed(4)}</td>`;
        tbody.appendChild(tr);
      });
      box.appendChild(wrap);
      el.appendChild(box);
    });
  }

  function renderChallengerStandings() {
    const el = viewContainer('challengerstandings');
    const { challenger } = computeStandings();
    const rows = Object.entries(challenger)
      .filter(([, pts]) => pts > 0)
      .map(([name, pts]) => ({ name, country: NAME_INDEX.get(name), points: pts }))
      .sort((a, b) => b.points - a.points);
    const lastChallengerKey = STATE.challengerLog.length ? STATE.challengerLog[STATE.challengerLog.length - 1] : null;
    attachMovement(rows, lastChallengerKey ? computeStandings(lastChallengerKey).challenger : null, ([, pts]) => pts > 0);
    el.innerHTML = `<div class="view-head"><h2>Challenger Series Standings</h2><div class="meta">${rows.length} players on the board</div></div>
      <p class="view-note">Season points from the auto-run Challenger Series companion events, at the same per-tournament value as the real Championship Series (Signature-tier FedEx Cup points) — but this board and that one never affect each other. The Move column shows the shift caused by the last Challenger Series event${lastChallengerKey ? ` (triggered by ${byKey[lastChallengerKey].name})` : ''}.</p>`;
    if (!rows.length) { el.innerHTML += '<p class="view-note">No Challenger Series events have run yet.</p>'; return; }
    standingsTable(el, rows);
  }

  // ---------------- reference view ----------------
  function weightedSample(pool, size, rng) {
    // Efraimidis-Spirakis weighted-without-replacement: higher weight (top of
    // the pool) -> key closer to 1 -> sorted first, but every entry keeps a
    // real chance, which is what gives week-to-week variation in the tail.
    const withKeys = pool.map((p, idx) => {
      const weight = 1 / Math.pow(idx + 1, 0.55);
      const key = Math.pow(rng(), 1 / weight);
      return { p, key };
    });
    withKeys.sort((a, b) => b.key - a.key);
    return withKeys.slice(0, size).map(x => x.p);
  }
  function renderReference() {
    const el = viewContainer('reference');
    el.innerHTML = `<div class="view-head"><h2>Depth Pool</h2><div class="meta">${DATA.backgroundPool.length} real players</div></div>
      <p class="view-note">The fixed 120 (see any Championship Series tab, or World Ranking) play every Championship Series event. Everyone here — real Korn Ferry Tour / DP World Tour players, ranked 121&ndash;${120 + DATA.backgroundPool.length} — is the open pool that Challenger Series and DP World Tour weeks draw from. It's not a closed roster: each week samples a different weighted subset, favoring the top of the pool but reaching into the tail for real variation.</p>
      <div class="chips"><button class="btn primary" id="resample-btn">Simulate this week's field</button><span class="chip" id="resample-count"></span></div>
      <div class="table-wrap" style="max-height:520px;"><table><thead><tr><th>Rank</th><th>Player</th><th>Ctry</th><th>This week?</th></tr></thead><tbody id="pool-body"></tbody></table></div>`;
    let sampledSet = new Set();
    const poolBody = el.querySelector('#pool-body');
    function drawPool() {
      poolBody.innerHTML = '';
      DATA.backgroundPool.forEach(p => {
        const tr = document.createElement('tr');
        const inField = sampledSet.has(p.name);
        tr.innerHTML = `<td class="rk mono">${p.rank}</td><td class="name">${p.name}</td><td class="ctry">${p.country}</td><td class="num">${inField ? '<span class="chip" style="border-color:var(--accent);color:var(--accent-strong);">In field</span>' : '<span class="dash">–</span>'}</td>`;
        poolBody.appendChild(tr);
      });
    }
    drawPool();
    el.querySelector('#resample-btn').addEventListener('click', () => {
      const size = 90 + Math.floor(Math.random() * 40);
      const sample = weightedSample(DATA.backgroundPool, size, Math.random);
      sampledSet = new Set(sample.map(p => p.name));
      el.querySelector('#resample-count').textContent = `${size}-man sample`;
      drawPool();
    });
  }

  // ---------------- data (save / load) ----------------
  // Everything lives in this browser's localStorage only — this tab lets a
  // player carry that data elsewhere (another device, a backup before
  // clearing browser data) as a plain JSON file or pasted text.
  function renderData() {
    const el = viewContainer('data');
    el.innerHTML = `<div class="view-head"><h2>Save &amp; Load</h2><div class="meta">back up or restore your season</div></div>
      <p class="view-note">Every score, lock, and Challenger Series result lives only in this browser's local storage — it won't follow you to another device or survive clearing browser data on its own. Use this tab to save a backup, and to restore one later.</p>
      <div class="data-section">
        <h3>Save your data</h3>
        <p class="view-note">Download a backup file, or copy the text below and store it somewhere safe.</p>
        <div class="picker-row">
          <button class="btn primary" id="download-data-btn">Download backup file</button>
          <button class="btn" id="copy-data-btn">Copy to clipboard</button>
          <span class="view-note" id="export-status" style="margin:0;"></span>
        </div>
        <textarea class="data-textarea mono" id="export-box" readonly spellcheck="false"></textarea>
      </div>
      <div class="data-section">
        <h3>Load your data</h3>
        <p class="view-note">Choose a previously-downloaded backup file, or paste its contents below, then restore. This replaces everything currently entered in this browser.</p>
        <div class="picker-row"><input type="file" id="import-file-input" accept="application/json,.json" /></div>
        <textarea class="data-textarea mono" id="import-box" spellcheck="false" placeholder="Paste backup JSON here…"></textarea>
        <div class="picker-row">
          <button class="btn danger" id="restore-data-btn">Restore from above</button>
          <span class="view-note" id="import-status" style="margin:0;"></span>
        </div>
      </div>`;

    const exportBox = el.querySelector('#export-box');
    const exportStatus = el.querySelector('#export-status');
    function refreshExport() { exportBox.value = JSON.stringify(STATE, null, 2); }
    refreshExport();

    el.querySelector('#download-data-btn').addEventListener('click', () => {
      refreshExport();
      const blob = new Blob([exportBox.value], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fairway-draft-board-${DATA.year}-backup.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      exportStatus.textContent = 'Backup file downloaded.';
    });
    el.querySelector('#copy-data-btn').addEventListener('click', async () => {
      refreshExport();
      exportBox.focus();
      exportBox.select();
      try {
        await navigator.clipboard.writeText(exportBox.value);
        exportStatus.textContent = 'Copied to clipboard.';
      } catch (e) {
        exportStatus.textContent = 'Couldn’t reach the clipboard — the text above is selected, copy it with Ctrl/Cmd+C.';
      }
    });

    const fileInput = el.querySelector('#import-file-input');
    const importBox = el.querySelector('#import-box');
    const importStatus = el.querySelector('#import-status');
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { importBox.value = reader.result; importStatus.textContent = `Loaded ${file.name} — review below, then Restore.`; };
      reader.onerror = () => { importStatus.textContent = 'Could not read that file.'; };
      reader.readAsText(file);
    });
    el.querySelector('#restore-data-btn').addEventListener('click', () => {
      let parsed;
      try { parsed = JSON.parse(importBox.value); } catch (e) { importStatus.textContent = 'That doesn’t look like valid backup JSON.'; return; }
      if (!parsed || typeof parsed !== 'object' || !parsed.scores || !parsed.roundLocked) {
        importStatus.textContent = 'That doesn’t look like a Fairway Draft Board backup.';
        return;
      }
      if (!confirm('Restore this backup? This replaces everything currently entered in this browser and cannot be undone.')) return;
      STATE = Object.assign(defaultState(), parsed);
      saveState();
      checkChallengerTriggers();
      checkCompletionLog();
      refreshExport();
      importStatus.textContent = 'Backup restored.';
    });
  }

  selectView('dice');
</script>
